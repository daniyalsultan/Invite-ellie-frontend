name: Build

# The Railway deploy runs `npm run build` (tsc -b && vite build) and fails the
# whole deployment on any TypeScript error — silently, while the previous
# bundle keeps serving. This check surfaces build breaks on every push so a
# red X appears instead of production quietly running stale code.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
